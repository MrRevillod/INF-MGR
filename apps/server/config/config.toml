[application]
port = 8000
host = "0.0.0.0"
event_queue_buffer_size = 100
body_limit = "5MB"
allowed_mime_types = ["application/pdf"]
client_app_url = "${PUBLIC_URL:http://localhost:3000}"

[postgres-db]
url = "${POSTGRES_DATABASE_URL:postgres://localhost:5432/inf_mgr}"
migration_path = "config/migrations"
min_connections = 1
max_connections = 10
acquire_timeout_ms = 5000

[redis]
url = "${REDIS_DATABASE_URL}"

[auth]
access_jwt_secret = "${SESSION_JWT_SECRET}"
refresh_jwt_secret = "${REFRESH_JWT_SECRET}"

access_exp_ms = 900000     # 15 minutes
refresh_exp_ms = 604800000 # 7 days

session_ttl_seconds = 604800 # 7 days

google_client_id = "${GOOGLE_CLIENT_ID}"
google_client_secret = "${GOOGLE_CLIENT_SECRET}"

google_redirect_url = "${GOOGLE_REDIRECT_URL}"

[cors]
allow_credentials = false
allowed_http_methods = ["GET", "POST", "PUT", "PATCH", "DELETE"]
allowed_http_headers = ["Content-Type", "Authorization"]

[mailer]
smtp_host = "${SMTP_HOST:localhost}"
smtp_port = "${SMTP_PORT}"
smtp_username = "${SMTP_USERNAME}"
smtp_password = "${SMTP_PASSWORD}"

[template-context]
public_url = "${PUBLIC_URL:http://localhost:8000}"
career_name = "${CAREER_NAME:Ingeniería en Informática}"
career_manager = "${CAREER_MANAGER:Director de Carrera}"
secretary_email = "${SECRETARY_EMAIL}"
