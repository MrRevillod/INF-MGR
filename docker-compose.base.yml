services:
  server_base:
    build:
      context: .
      dockerfile: ./apps/server/Dockerfile
    volumes:
      - ./apps/server:/app/apps/server
      - ./Cargo.toml:/app/Cargo.toml
      - ./Cargo.lock:/app/Cargo.lock
      - cargo_cache:/usr/local/cargo/registry
      - server_target:/app/target
    ports:
      - "8000:8000"
    networks:
      - my_networks

  client_base:
    build:
      context: .
      dockerfile: ./apps/client/Dockerfile
    volumes:
      - client_node_modules:/app/node_modules
    networks:
      - my_networks

  nginx_base:
    image: nginx:alpine
    ports:
      - "80:80"
    networks:
      - my_networks

  postgres_base:
    image: postgres:15
    command: postgres -c log_statement=none -c log_duration=off -c log_min_duration_statement=-1
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_NAME}'" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - my_networks

  redis_base:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - my_networks


  students_api_base:
    build:
      context: .
      dockerfile: ./apps/students-api/Dockerfile
    volumes:
      - ./apps/students-api:/app
      - uv_cache:/root/.cache/uv
    networks:
      - my_networks


volumes:
  cargo_cache:
  server_target:
  client_node_modules:
  uv_cache:


networks:
  my_networks:
    driver: bridge
