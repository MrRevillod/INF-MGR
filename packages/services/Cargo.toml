[package]
name = "services"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lettre = { version = "0.11.17", features = ["tokio1-native-tls"] }

sword = { git = "https://github.com/MrRevillod/sword.git", branch = "main", features = [
    "multipart",
    "cookies",
    "helmet",
    "validator",
] }

thiserror = "2.0.17"
tera = "1.20.0"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
futures = "0.3.31"
glob = "0.3.3"
# zip = "6.0.0"

rig-core = { version = "0.23.1", features = ["derive"] }
rig-qdrant = "0.1.29"
rig-fastembed = "0.2.15"
qdrant-client = { version = "1.15.0", features = ["serde"] }
