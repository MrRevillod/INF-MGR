[package]
name = "services"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
serde = { version = "1.0", features = ["derive"] }
lettre = { version = "0.11.17", features = ["tokio1-native-tls"] }

tex_parser = { path = "../tex_parser" }

sword = { git = "https://github.com/MrRevillod/sword.git", branch = "main", features = [
    "multipart",
    "cookies",
    "helmet",
    "validator",
] }

thiserror = "2.0.17"
tera = "1.20.0"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
futures = "0.3.31"

qdrant-client = { version = "1.15.0", features = ["serde"] }
reqwest = { version = "0.12.24", features = ["json"] }
chrono = "0.4.42"
serde_json = "1.0.145"
tracing = "0.1.41"
